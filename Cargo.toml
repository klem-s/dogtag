[package]
name = "dogtag"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Session stats for WARDOGS: reads the HUD from the screen, live OBS overlay, pushes each session somewhere."

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ocrs = "0.10"
rten = "0.21"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
xcap = "0.7"

[profile.release]
lto = true
opt-level = 3
