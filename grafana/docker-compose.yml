# Grafana + VictoriaMetrics pour dogtag.   docker compose up -d   puis   http://localhost:3000
services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    command: ["-storageDataPath=/storage", "-retentionPeriod=10y"]
    ports: ["8428:8428"]            # dogtag envoie sur http://localhost:8428/write
    volumes: [vmdata:/storage]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: wardogs     # change-le
      GF_AUTH_ANONYMOUS_ENABLED: "true"       # le tableau de bord se voit sans se connecter
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/wardogs.json
    volumes:
      - ./provisioning:/etc/grafana/provisioning
      - ./dashboards:/var/lib/grafana/dashboards
      - grafanadata:/var/lib/grafana
    depends_on: [victoriametrics]
    restart: unless-stopped
volumes:
  vmdata:
  grafanadata:
