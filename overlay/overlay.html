<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>dogtag overlay</title>
<!-- OBS: add a Browser source on http://127.0.0.1:47900/ , 520 x 140, transparent.
     ?scale=0.8 to shrink, ?side=right to put the hole on the right. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&family=Big+Shoulders+Text:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --steel-hi: #e3e5e0;
    --steel: #b9bdb6;
    --steel-lo: #868b83;
    --stamp: #2f332d;
    --chain: #9a9e96;
    --num: "Big Shoulders Stencil Display", "Impact", "Arial Narrow", sans-serif;
    --txt: "Big Shoulders Text", "Arial Narrow", "Segoe UI", sans-serif;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { padding: 14px; }

  .tag {
    position: relative;
    box-sizing: border-box;
    width: 490px;
    padding: 16px 26px 14px 76px;
    border-radius: 34px;
    color: var(--stamp);
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, rgba(0,0,0,.03) 1px 3px),
      linear-gradient(160deg, var(--steel-hi), var(--steel) 45%, var(--steel-lo));
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.7),
      inset 0 -3px 0 rgba(0,0,0,.18),
      inset 0 0 0 5px rgba(255,255,255,.08),
      0 6px 18px rgba(0,0,0,.45);
    transform-origin: top left;
    transition: box-shadow .3s;
  }
  body.right .tag { padding: 16px 76px 14px 26px; }

  /* the punched hole and a bit of ball chain */
  .hole {
    position: absolute; left: 28px; top: 50%; width: 26px; height: 26px; margin-top: -13px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 60%, rgba(0,0,0,.55), rgba(0,0,0,.25) 60%, transparent 70%);
    box-shadow: inset 0 2px 3px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.6);
  }
  body.right .hole { left: auto; right: 28px; }
  .chain {
    position: absolute; left: 36px; top: -60px; width: 10px; height: 100px;
    background: radial-gradient(circle, var(--chain) 3px, #5c605a 4px, transparent 5px) 0 0 / 10px 10px repeat-y;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.5));
  }
  body.right .chain { left: auto; right: 36px; }

  .name {
    font: 700 17px/1 var(--txt);
    letter-spacing: .06em;
    margin: 0 0 8px;
    text-shadow: 0 1px 0 rgba(255,255,255,.55), 0 -1px 0 rgba(0,0,0,.3);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .name small { font-weight: 500; font-size: 14px; opacity: .75; letter-spacing: .02em; }

  .money .v {
    font: 800 46px/0.9 var(--num);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1.5px 0 rgba(255,255,255,.6), 0 -1px 0 rgba(0,0,0,.35);
    display: inline-block;
    white-space: nowrap;
  }
  .money .l { font: 500 14px/1.2 var(--txt); opacity: .8; margin-top: 2px; }

  .minor { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 9px; font: 500 16px/1 var(--txt); opacity: .8; }
  .minor b { font: 800 21px/1 var(--num); opacity: 1; margin-right: 3px; }

  /* the one moment: a number that changes gets stamped in */
  .stamped { animation: stamp .42s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes stamp {
    0% { transform: scale(1.35) translateY(-4px); filter: blur(1.5px); opacity: .2; }
    55% { transform: scale(.94); filter: none; opacity: 1; }
    100% { transform: none; }
  }
  .off { opacity: .45; }
  @media (prefers-reduced-motion: reduce) { .stamped { animation: none; } }
</style>
</head>
<body>
  <div class="tag" id="tag">
    <div class="chain"></div>
    <div class="hole"></div>
    <p class="name"><span id="player">dogtag</span><small id="time">en attente du jeu</small></p>
    <div class="money"><span class="v" id="balance">$0</span><span class="l">solde</span></div>
    <div class="minor">
      <span><b id="rank">?</b>niveau</span>
    </div>
  </div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var scale = parseFloat(q.get("scale") || "1");
  if (scale && scale !== 1) document.getElementById("tag").style.transform = "scale(" + scale + ")";
  if (q.get("side") === "right") document.body.classList.add("right");

  var last = {};
  function set(id, text) {
    var el = document.getElementById(id);
    if (last[id] === text) return;
    var first = !(id in last);
    last[id] = text;
    el.textContent = text;
    if (!first) { el.classList.remove("stamped"); void el.offsetWidth; el.classList.add("stamped"); }
  }
  function soldeText(v) {
    return v == null ? "?" : (v < 0 ? "-$" : "$") + Math.abs(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }
  function draw(s) {
    document.getElementById("tag").classList.remove("off");
    set("player", s.player || "dogtag");
    set("balance", soldeText(s.balance_now));
    set("rank", s.rank == null ? "?" : String(s.rank));
    document.getElementById("time").textContent = (s.minutes || 0) + " min";
  }
  function connect() {
    var ws;
    try { ws = new WebSocket("ws://" + (location.host || "127.0.0.1:47900") + "/ws"); }
    catch (e) { return setTimeout(connect, 3000); }
    ws.onmessage = function (m) { try { draw(JSON.parse(m.data)); } catch (e) {} };
    ws.onclose = function () {
      document.getElementById("tag").classList.add("off");
      document.getElementById("time").textContent = "dogtag n'est pas lancé";
      setTimeout(connect, 3000);
    };
  }
  connect();
})();
</script>
</body>
</html>
